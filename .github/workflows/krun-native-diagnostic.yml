name: Krun native diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/krun-native-diagnostic.yml

permissions:
  contents: read

jobs:
  runtime-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install diagnostic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y strace qemu-utils qemu-system-x86
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - name: Probe KVM and trace minimal krun boot
        run: |
          set -euo pipefail
          private="$(mktemp -d)"
          trap 'rm -rf "$private"' EXIT
          mkdir -p "$private/home" "$private/cache" diagnostic-output
          ulimit -c 0
          # Only sanitized facts are written to the artifact; raw syscall traces stay private.
          python3 - <<'PY' > diagnostic-output/kvm.txt
          import fcntl, os, pathlib
          print('Host:', os.uname().sysname, os.uname().release, os.uname().machine)
          flags = set()
          for line in pathlib.Path('/proc/cpuinfo').read_text().splitlines():
              if line.startswith('flags'):
                  flags.update(line.split(':', 1)[1].split())
                  break
          print('CPU virtualization flags:', ','.join(flag for flag in ('vmx', 'svm', 'hypervisor') if flag in flags) or 'none')
          for module in ('kvm_intel', 'kvm_amd'):
              path = pathlib.Path('/sys/module') / module / 'parameters/nested'
              print(f'{module} nested:', path.read_text().strip() if path.exists() else 'unavailable')
          fds = []
          try:
              kvm = os.open('/dev/kvm', os.O_RDWR | os.O_CLOEXEC)
              fds.append(kvm)
              print('KVM_GET_API_VERSION:', fcntl.ioctl(kvm, 0xAE00, 0))
              vm = fcntl.ioctl(kvm, 0xAE01, 0)  # KVM_CREATE_VM
              fds.append(vm)
              print('KVM_CREATE_VM: success')
              vcpu = fcntl.ioctl(vm, 0xAE41, 0)  # KVM_CREATE_VCPU
              fds.append(vcpu)
              print('KVM_CREATE_VCPU: success')
          except OSError as exc:
              print('KVM ioctl failure:', exc.errno, exc.strerror)
          finally:
              for fd in reversed(fds):
                  os.close(fd)
          PY
          cat diagnostic-output/kvm.txt
          # QEMU initialization is only a baseline, not proof that krun has identical requirements.
          set +e
          timeout 5s env -i HOME="$private/home" PATH="$PATH" LANG=C \
            qemu-system-x86_64 -machine q35,accel=kvm -m 128M -nodefaults -display none -monitor none -S \
            >"$private/qemu.out" 2>&1
          qemu_status=$?
          set -e
          echo "QEMU KVM initialization timeout status (124 means remained running): $qemu_status" | tee -a diagnostic-output/kvm.txt
          node_binary="$(command -v node)"
          set +e
          timeout --kill-after=10s 90s env -i HOME="$private/home" XDG_CACHE_HOME="$private/cache" \
            PATH="$PATH" LANG=C RUST_BACKTRACE=full \
            strace -f -qq -s 256 -e trace=process,ioctl -o "$private/trace" \
            "$node_binary" --input-type=module -e '
          import { VM, MemoryProvider } from "@earendil-works/gondolin";
          let vm;
          try {
            vm = await VM.create({ sandbox: { vmm: "krun" }, vfs: { mounts: { "/workspace": new MemoryProvider() } } });
            await vm.start();
            await vm.exec("echo diagnostic");
          } finally {
            if (vm) await vm.close();
          }
          ' >"$private/boot.out" 2>&1
          trace_status=$?
          set -e
          # The cache and home are private, fresh, and contain only this unauthenticated probe's assets.
          python3 - "$private" <<'PY' > diagnostic-output/image-format.txt
          import json, os, pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          count = 0
          for base in (root / 'cache', root / 'home'):
              for directory, _, names in os.walk(base, followlinks=False):
                  for name in sorted(names):
                      if not re.search(r'kernel|vmlinux|vmlinuz|initrd|initramfs|manifest', name, re.I):
                          continue
                      path = pathlib.Path(directory) / name
                      relative = str(path.relative_to(root))
                      if path.is_symlink() or not re.fullmatch(r'[A-Za-z0-9_./+-]{1,240}', relative):
                          continue
                      count += 1
                      size = path.stat().st_size
                      with path.open('rb') as stream:
                          header = stream.read(16).hex()
                          stream.seek(0x202)
                          boot_magic = stream.read(4).hex()
                      print(f'Image asset: {relative}; bytes={size}; first16={header}')
                      if re.search(r'kernel|vmlinux|vmlinuz', name, re.I):
                          print(f'Kernel header: ELF={header.startswith("7f454c46")}; x86_boot_0x202={boot_magic}')
                      if 'manifest' in name.lower() and size <= 1_000_000:
                          try:
                              manifest = json.loads(path.read_text())
                              if isinstance(manifest, dict):
                                  keys = sorted(key for key in manifest if re.fullmatch(r'[A-Za-z0-9_.-]{1,80}', key))
                                  print('Manifest keys:', ','.join(keys))
                          except (ValueError, UnicodeError):
                              print('Manifest is not readable JSON')
          print(f'Matching image assets: {count}')
          PY
          cat diagnostic-output/image-format.txt
          python3 - "$private/trace" "$trace_status" "$private/boot.out" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[3]).read_text(errors='replace')
          denial = re.search(r'(?:ptrace|PTRACE_TRACEME):\s*(?:Operation not permitted|Permission denied)', output, re.I)
          if denial:
              raise SystemExit(f'Tracing denied: {denial.group(0)}')
          if not path.exists():
              raise SystemExit('No syscall trace was produced; process tracing failed')
          lines = [f'Minimal boot trace exit status: {int(sys.argv[2])}']
          ids = {}
          def label(pid):
              if pid not in ids:
                  ids[pid] = len(ids) + 1
              return f'P{ids[pid]}'
          for line in path.read_text(errors='replace').splitlines():
              match = re.match(r'\s*(\d+)\s+(.*)', line)
              if not match:
                  continue
              pid, call = match.groups()
              spawn = re.search(r'(?:clone3?|fork|vfork)\(.*\)\s+=\s+(\d+)\s*$', call)
              if spawn:
                  lines.append(f'{label(pid)} spawned {label(spawn.group(1))}')
              execute = re.match(r'execve\("([^"\n]+)"', call)
              if execute:
                  name = pathlib.PurePosixPath(execute.group(1)).name
                  allowed = {'node', 'gondolin-krun-runner', 'qemu-img', 'sh'}
                  phase = ' (version-check)' if name == 'gondolin-krun-runner' and '"--version"' in call else ''
                  lines.append(f'{label(pid)} exec {name if name in allowed else "other"}{phase}')
              ioctl = re.search(r'\b(KVM_[A-Z0-9_]+)\b.*?=\s+(-?\d+)(?:\s+([A-Z][A-Z0-9_]+))?', call)
              if ioctl:
                  suffix = f' {ioctl.group(3)}' if ioctl.group(3) else ''
                  lines.append(f'{label(pid)} {ioctl.group(1)} result {ioctl.group(2)}{suffix}')
          text = '\n'.join(lines) + '\n'
          if re.search(r'token|secret|password|authorization|api[_-]?key|gh[opsu]_|github_pat', text, re.I):
              raise SystemExit('Sanitized trace rejected by credential-pattern inspection')
          pathlib.Path('diagnostic-output/krun-syscalls.txt').write_text(text)
          print(text, end='')
          if not any('exec gondolin-krun-runner' in line for line in lines):
              raise SystemExit('Krun runner exec not observed; process chain incomplete or tracing denied')
          PY
      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krun-runtime-boundaries
          path: diagnostic-output/
          if-no-files-found: warn
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
