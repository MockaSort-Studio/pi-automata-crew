name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  krun-diagnostics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HALL_VMM: qemu
      HALL_VM_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install VM prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils qemu-system-x86
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Capture host and runner details
        run: |
          mkdir -p diagnostic-logs
          {
            uname -a
            cat /etc/os-release
            ls -l /dev/kvm
            node -p "require('./node_modules/@earendil-works/gondolin/package.json').version"
            node -p "require('./node_modules/@earendil-works/gondolin-krun-runner-linux-x64/package.json').version"
            qemu-img --version
            qemu-system-x86_64 --version
          } 2>&1 | tee diagnostic-logs/host.txt
      - name: Probe krun executable and boot
        run: |
          set -o pipefail
          export PATH="$PWD/node_modules/.bin:$PATH"
          runner="$(node -p "require('node:path').join(require('node:path').dirname(require.resolve('@earendil-works/gondolin-krun-runner-linux-x64/package.json')), 'bin/gondolin-krun-runner')")"
          status=0
          {
            echo "Runner: $runner"
            ls -l "$runner"
            file "$runner"
            echo 'Shared libraries:'
            ldd "$runner" || { code=$?; echo "ldd exit: $code"; status=1; }
            echo 'Runner version:'
            timeout --kill-after=5s 20s "$runner" --version || { code=$?; echo "version exit: $code"; status=1; }
            echo 'Minimal krun boot:'
            RUST_BACKTRACE=full timeout --kill-after=5s 60s node --input-type=module <<'EOF' || { code=$?; echo "boot exit: $code"; status=1; }
          import { VM } from '@earendil-works/gondolin';
          let vm;
          try {
            vm = await VM.create({ sandbox: { vmm: 'krun' } });
            await vm.start();
            const result = await vm.exec('echo krun-boot-ok');
            console.log('Guest result:', JSON.stringify(result));
            if (result.exitCode !== 0 || !result.stdout.includes('krun-boot-ok')) process.exitCode = 1;
          } catch (error) {
            console.error(error);
            process.exitCode = 1;
          } finally {
            if (vm) await vm.close();
          }
          EOF
            echo "Diagnostic status: $status"
            exit "$status"
          } 2>&1 | tee diagnostic-logs/krun-probe.txt
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krun-diagnostics-${{ matrix.os }}
          path: diagnostic-logs/
          if-no-files-found: warn
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Hosted Linux krun crashes with a virtio ECONNRESET; QEMU passed the same live-agent tests.
    # Keep production VMM selection unchanged while the krun crash and leaked handles are investigated.
    env:
      HALL_VMM: qemu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install VM prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils qemu-system-x86
          qemu-img --version
          qemu-system-x86_64 --version
      - name: Report Gondolin VMM selection
        run: |
          node --input-type=module <<'EOF'
          import { createRequire } from 'node:module';
          import { chooseVmm } from './extensions/crew/env-runtime/lib/guest-vmm.mjs';
          const require = createRequire(import.meta.url);
          try {
            console.log('krun runner:', require.resolve('@earendil-works/gondolin-krun-runner-linux-x64/package.json'));
          } catch (error) {
            console.log('krun runner unavailable:', error.message);
          }
          console.log('selected VMM:', chooseVmm());
          EOF
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Read Gondolin version
        id: gondolin
        run: echo "version=$(node -p "require('./node_modules/@earendil-works/gondolin/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gondolin
            ~/.pi/agent/cache/gondolin
          key: gondolin-${{ runner.os }}-${{ runner.arch }}-${{ steps.gondolin.outputs.version }}
      # Crew workers run this suite from inside a worker; set their identity variables so every CI
      # run proves the suite does not depend on, or break under, an inherited worker environment.
      - run: npm test
        env:
          PI_SDK_ACTOR_ID: ci-worker-probe
          PI_CREW_WORKER_CONFIG: /nonexistent/worker.json
          PI_CREW_COMM_TOKEN: ci-probe-token
          PI_SESSION_ID: ci-probe-session
      - run: npm run format:check
